[[groups]]
name = "Read by the Linux kernel"
ids = ["/sys/class/power_supply"]
receiver = "any peripheral battery the kernel reports"
how = "whiskerd shows these too, updated on kernel change events."
cable = "Check with: ls /sys/class/power_supply"

